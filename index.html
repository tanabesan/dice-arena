<style>
:root{--bg:#12141c;--panel:#1c2030;--panel2:#262b40;--text:#e8eaf3;--sub:#8a90a8;--acc:#ffc84a;--red:#ff5a6a;--grn:#4fdc8a;--blu:#5ab4ff;--vio:#b57aff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:2px;color:var(--acc);display:flex;align-items:center;gap:8px}
h2{font-size:15px;margin:14px 0 8px;color:var(--sub);font-weight:600}
.px{image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle;display:inline-block}
.panel{background:var(--panel);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{background:var(--acc);color:#222;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer}
.btn:disabled{background:#444;color:#888;cursor:not-allowed}
.btn.sub{background:var(--panel2);color:var(--text)}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.face{background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;min-height:96px}
.face.sel{border-color:var(--acc);box-shadow:0 0 0 2px #ffc84a44}
.face .n{font-size:11px;color:var(--sub)}
.face .ic{height:44px;display:flex;align-items:center;justify-content:center}
.face .nm{font-size:12px;font-weight:700}
.face .ct{font-size:11px;color:var(--acc)}
.pal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.pal{grid-template-columns:repeat(3,1fr)}}
.sk{background:var(--panel2);border-radius:10px;padding:8px 10px;cursor:pointer;border:2px solid transparent}
.sk:active{border-color:var(--acc)}
.sk .t{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.sk .t span:first-child{display:flex;align-items:center;gap:6px}
.sk .d{font-size:11px;color:var(--sub);margin-top:2px}
.pt{color:var(--acc);font-weight:700}
.bar{height:14px;background:#0c0e15;border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;transition:width .4s}
.hp{background:var(--grn)}.ehp{background:var(--red)}.cost{background:var(--acc)}.over{background:var(--red)}
.stat{font-size:12px;color:var(--sub)}
.stat .px{margin:0 1px 0 6px}
.fighter{flex:1;min-width:140px;text-align:center}
.fighter .nm{font-weight:700;margin-bottom:4px}
.fighter .nm .px{margin-right:6px}
.fighter .stat{text-align:left}
.spr{height:64px;display:flex;align-items:center;justify-content:center;margin:6px 0}
.spr.hit .px{animation:hit .3s}
@keyframes hit{0%,100%{transform:translateX(0);filter:none}25%{transform:translateX(-6px);filter:brightness(2.5)}75%{transform:translateX(6px);filter:brightness(2.5)}}
.die{width:84px;height:84px;margin:8px auto;border-radius:14px;background:#2a2f47;border:3px solid #4a5175;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 4px 0 #14162a}
.die .nm{font-size:11px;font-weight:700}
.die.roll{animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-4px)}100%{transform:rotate(-8deg)}}
.log{background:#0c0e15;border-radius:10px;padding:8px 10px;height:160px;overflow-y:auto;font-size:13px;line-height:1.9}
.log .p{color:var(--blu)}.log .e{color:var(--red)}.log .s{color:var(--sub)}
.log .px{margin:0 3px}
.mini{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.mini span{background:var(--panel2);border-radius:6px;padding:3px;line-height:0}
.center{text-align:center}
.bigico{margin:6px 0}
.face.sac{background:#3a2230}
.face.sac .n{color:var(--red)}
.mini span.sac{background:#4a2434}
.optlabel{margin-top:10px}
.hprow{margin:8px 0;justify-content:space-between;flex-wrap:nowrap}
.hprow .btn{width:52px;padding:8px 0;font-size:20px}
.hpview{text-align:center;line-height:1.5}
.face .ic{position:relative}
.badge{position:absolute;right:calc(50% - 38px);bottom:-2px;line-height:0;background:#12141c;border-radius:5px;padding:1px;display:flex}
.mini span{position:relative}
.eb{position:absolute;right:-3px;bottom:-3px;line-height:0;background:#12141c;border-radius:3px;display:flex}
.encrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.encbtn{font-size:12px;padding:6px 2px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.encbtn.on{border-color:var(--acc);background:#3a3420}
.encbtn:disabled{opacity:.35}
.encbtn small{font-size:10px;color:var(--acc)}
.die .nm{text-align:center;line-height:1.2;padding:0 2px}
.sacrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.sacbtn{font-size:13px;padding:8px 2px;border:2px solid transparent;line-height:1.3}
.sacbtn small{font-size:11px;font-weight:600}
.sacbtn.on{background:#4a2434;border-color:var(--red);color:#ffd0d6}
.sacbtn:disabled{background:var(--panel2);color:var(--sub);opacity:.6}

/* ===== 8bit theme ===== */
:root{--bg:#0f0f1b;--panel:#1a1c2c;--panel2:#333c57;--text:#f4f4f4;--sub:#94b0c2;--acc:#ffcd75;--red:#ef7d57;--grn:#73eff7;--blu:#41a6f6;--vio:#b13e53}
*{border-radius:0!important}
body{font-family:'DotGothic16','Hiragino Sans','Noto Sans JP',monospace;font-size:15px;background-color:var(--bg);
  background-image:linear-gradient(#ffffff09 2px,transparent 2px),linear-gradient(90deg,#ffffff09 2px,transparent 2px);background-size:16px 16px}
button,input{font-family:inherit}
h1{font-size:26px;text-shadow:3px 3px 0 #000,-1px -1px 0 #b13e53;letter-spacing:3px}
h2{color:var(--acc);font-size:15px}h2::before{content:'▶ '}
.panel,.log,.die{border:4px solid var(--text);background:var(--panel);box-shadow:inset 0 0 0 3px #000,5px 5px 0 #000}
.panel{padding:14px}
.log{background:#000;font-size:14px}
.die{background:#10122a}
.btn{border:4px solid #000;box-shadow:inset 4px 4px 0 #fff5,inset -4px -4px 0 #0006,0 4px 0 #000;letter-spacing:1px;transition:none}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:inset 4px 4px 0 #0006,0 0 0 #000}
.btn:disabled{box-shadow:inset 4px 4px 0 #fff2,0 4px 0 #000}
.btn.sub{border-color:#000;box-shadow:inset 4px 4px 0 #fff3,inset -4px -4px 0 #0006,0 4px 0 #000}
.face,.sk{border:4px solid #000;box-shadow:inset 0 0 0 2px #fff3,3px 3px 0 #000}
.face.sel{border-color:var(--acc);box-shadow:inset 0 0 0 2px #000,3px 3px 0 #000;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{border-color:#fff}}
.sk:active,.sk:hover{border-color:var(--acc)}
.sk:hover .t span:first-child::before{content:'▶';color:var(--acc)}
.bar{height:18px;border:3px solid var(--text);background:#000}
.bar>i{transition:width .4s steps(8);background-image:repeating-linear-gradient(90deg,transparent 0 6px,#0007 6px 8px)}
.hp{background-color:#38b764}.ehp{background-color:#b13e53}
.mini span{border:2px solid #000}
input{border:4px solid var(--text)!important;background:#000!important;color:var(--text)!important;outline:0}
input:focus{border-color:var(--acc)!important}
.encbtn.on,.sacbtn.on{box-shadow:inset 0 0 0 3px var(--acc),0 4px 0 #000}
.stat{color:var(--sub)}
#chat{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#000f;border-top:4px solid var(--text);padding:6px 10px;max-width:1100px;margin:0 auto}
#clog{font-size:12px;min-height:34px;max-height:34px;overflow:hidden;line-height:1.4}
.stamp{padding:6px 8px;font-size:13px}
body.chatting #app{height:calc(100vh - 50px);height:calc(100dvh - 50px)}
.sk.lock{opacity:.35}
#chat input{flex:1;min-width:0;padding:8px}

/* ===== 1画面レイアウト ===== */
html,body{height:100%;overflow:hidden}
body{display:flex;justify-content:center;min-height:0}
#app{width:100%;max-width:1100px;height:100vh;height:100dvh;padding:8px 10px;overflow-y:auto;overflow-x:hidden}
h1{font-size:17px;margin:0;letter-spacing:2px;text-shadow:2px 2px 0 #000}
h2{margin:8px 0 4px;font-size:13px}
.panel{padding:8px 10px;margin-bottom:8px;border-width:3px;box-shadow:inset 0 0 0 2px #000,3px 3px 0 #000}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.tabs{display:flex;gap:4px}
.tab{font-family:inherit;font-size:13px;padding:6px 10px;border:3px solid #000;background:var(--panel2);color:var(--text);cursor:pointer}
.tab.on{background:var(--acc);color:#222}
.pane{display:none}.pane.on{display:block}
.faces{grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:4px}
.face{min-height:0;padding:3px 1px;border-width:3px}
.face .ic{height:34px}
.face .nm{font-size:10px;line-height:1.15;min-height:24px;display:flex;align-items:center;justify-content:center}
.face .ct{font-size:10px}.face .n{font-size:9px}
.face .badge{right:calc(50% - 26px)}
.pal{grid-template-columns:repeat(5,1fr);gap:4px}
.sk{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 1px;text-align:center;border-width:3px}
.sk .nm{font-size:10px;font-weight:700}
.sk .pt{font-size:10px}
.dl{margin:4px 0;min-height:30px;font-size:12px}
.sq{width:36px;padding:4px 0;font-size:18px}
.chip{padding:4px 6px;flex:1}.chip.on{border-color:var(--acc)}
.sacrow,.encrow{gap:4px}
.encbtn,.sacbtn{padding:4px 1px;font-size:11px}
.bt{display:flex;flex-direction:column;height:100%;min-height:0}
.bt .panel{margin-bottom:6px}
.bt .log{flex:1;height:auto;min-height:48px}
.spr{height:48px;margin:2px 0}
.die{width:60px;height:60px;margin:4px auto;border-width:3px}
.fighter{min-width:0}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.orow{margin:0;flex-wrap:nowrap;font-size:12px;gap:4px}
.orow .btn{padding:6px 8px;font-size:12px}
.mtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.mbody{flex:1;min-height:0;overflow-y:auto}
.mbody .panel{font-size:13px}
@media(min-width:900px){.tabs{display:none}.bwrap{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:12px;align-items:start}.pane{display:block}.pal{grid-template-columns:repeat(4,1fr)}.face .ic{height:40px}h1{font-size:20px}}
@media(max-height:620px){.panel{padding:6px 8px;margin-bottom:6px}.dl{min-height:0}.spr{height:40px}.die{width:48px;height:48px}}

/* ===== 1画面レイアウト(調整) ===== */
.btn{padding:8px 14px;font-size:14px}
.slot{margin:4px 0}
.slot .mini{flex-wrap:nowrap;justify-content:flex-start;margin:0;gap:2px}
.slot .mini span{padding:2px}
.sbtn{padding:4px 8px!important;font-size:12px!important}
.mgrid{display:block}
@media(min-width:600px){.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}.ogrid{grid-template-columns:1fr 1fr 1fr}}
@media(orientation:landscape) and (max-height:520px) and (max-width:899px){
  .pA.on{display:grid;grid-template-columns:1fr 1.1fr;grid-template-areas:"p l" "f l" "d l" "g l";gap:0 10px;align-content:start}
  .pA>.panel{grid-area:p}.pA>.faces{grid-area:f}.pA>.dl{grid-area:d}.pA>.pal{grid-area:l;align-self:start}.pA>.gorow{grid-area:g}
  .encbtn small{display:none}.top{margin-bottom:4px}
  .mbody .panel{font-size:12px}
}

.skl{display:block}
@media(min-width:600px){.skl{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}}
@media(orientation:landscape) and (max-height:520px) and (max-width:899px){
  .pC .panel>.stat:last-child,.pC .panel>.stat:nth-child(2){display:none}
  .optlabel{margin-top:4px}.sacbtn,.encbtn{padding:2px 1px}
  .pme .stat,h2{display:none}.pme{padding:4px 8px}.orow .btn{padding:3px 6px}
  .face .px{width:24px;height:24px}.face .ic{height:26px}
  #clog{min-height:20px;max-height:20px}
  body.chatting #app{height:calc(100vh - 38px);height:calc(100dvh - 38px)}
}

.skl>div{margin:2px 0!important}
@media(orientation:landscape) and (max-height:520px) and (max-width:899px){
  .face .n{display:none}.sq{width:30px;padding:2px 0}.gorow{margin-top:4px!important}
  .dl{margin:2px 0}.pA>.panel .bar{margin:3px 0!important}h1{font-size:15px}.top{margin-bottom:2px}
  .skl>div{margin:1px 0!important}
}

@media(orientation:landscape) and (max-height:520px) and (max-width:899px){
  .pS .panel{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.pS .panel>b{grid-column:1/-1}

/* ===== スキルのひし形マーク ===== */
.dia{--c1:#aab3c8;--c2:#5a6078;position:relative;display:inline-flex;align-items:center;justify-content:center;width:calc(var(--sz)*1px);height:calc(var(--sz)*1px);vertical-align:middle;flex:none}
.dia::before,.dia::after{content:'';position:absolute;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.dia::before{inset:0;background:#000}
.dia::after{inset:3px;background:linear-gradient(135deg,var(--c1) 0%,var(--c2) 100%)}

.dia.atk{--c1:#ff8a64;--c2:#b0243a}.dia.def{--c1:#7cccff;--c2:#2a6fc0}.dia.grn{--c1:#7ef0b0;--c2:#1f8f52}

const faceCost=f=>baseCost(f)-f.s;
const maxSac=f=>Math.min(3,baseCost(f));
const canEnch=(k,e)=>ENCH[e].only.includes(k);
const fname=f=>(f.e.length?f.e.map(e=>ENCH[e].name).join('・')+'の':'')+SK[f.k].name;

function eff(f){const o={...SK[f.k]};f.e.forEach(e=>{if(canEnch(f.k,e))ENCH[e].f(o)});return o}

function newGame(){

function setSk(k){const f=G.die[G.sel];f.k=k;f.e=f.e.filter(e=>canEnch(k,e));f.s=Math.min(f.s,maxSac(f));G.sel=(G.sel+1)%6;build()}
function setSac(L){const f=G.die[G.sel];if(L>maxSac(f))return;f.s=L;build()}
function setEnch(e){const f=G.die[G.sel];
  if(!e)f.e=[];
  else if(f.e.includes(e))f.e=[];
  else if(canEnch(f.k,e))f.e=[e];
  f.s=Math.min(f.s,maxSac(f));build()}

function pushLog(t,c){const l=$('#log');if(!l)return;l.insertAdjacentHTML('beforeend',`<div class="${c||''}">${t}</div>`);l.scrollTop=l.scrollHeight}

async function turn(){
  if(B.busy)return;B.busy=true;$('#roll').disabled=true;
  $('#pdie').classList.add('roll');$('#edie').classList.add('roll');
  for(let i=0;i<6;i++){showDie('#pdie',{k:ORDER[Math.random()*ORDER.length|0],e:[]});showDie('#edie',{k:ORDER[Math.random()*ORDER.length|0],e:[]});await sleep(90)}
  const pf=G.die[Math.random()*6|0], ef=B.en.dice[Math.random()*6|0];
  $('#pdie').classList.remove('roll');$('#edie').classList.remove('roll');
  showDie('#pdie',pf);showDie('#edie',ef);
  await sleep(300);
  const ph=B.p.hp, eh=B.e.hp;
  resolve(pf,ef);
  if(B.p.hp<ph)flash('#pspr');
  if(B.e.hp<eh)flash('#espr');
  upd();
  const pd=B.p.hp<=0, ed=B.e.hp<=0;
  if(pd||ed){await sleep(800);return end(ed&&!pd)}
  B.busy=false;$('#roll').disabled=false;
}
function resolve(pf,ef){
  const P=eff(pf,B.p.fr,B.p.cc),E=eff(ef,B.e.fr,B.e.cc),pk=pf.k,ek=ef.k;
  addLog(`あなた: ${ic(pk,2)}${fname(pf)}${pf.s?`(代償${pf.s})`:''} / ${B.en.name}: ${ic(ek,2)}${fname(ef)}`,'s');
  if(pf.s){const sd=SELF[pf.s];B.p.hp-=sd;addLog(`${ic('drain',2)}代償で自分に${sd}ダメージ`,'e')}
  if(ef.s){const sd=SELF[ef.s];B.e.hp-=sd;addLog(`${ic('drain',2)}${B.en.name}は代償で${sd}ダメージ`,'p')}
  if(P.crit&&CR.p<P.crit){P.dmg=Math.round(P.dmg*P.cm);addLog(`${ic(pk,2)}会心!`,'p')}
  if(E.crit&&CR.e<E.crit){E.dmg=Math.round(E.dmg*E.cm);addLog(`${ic(ek,2)}${B.en.name}の会心!`,'e')}
  const rawP=(P.dmg||0)*(P.hits||1),rawE=(E.dmg||0)*(E.hits||1);
  const pBlk={v:P.block||0},eBlk={v:E.block||0};
  if(pBlk.v)addLog(`${ic('guard',2)}あなたは${pBlk.v}ブロック`,'p');
  if(eBlk.v)addLog(`${ic('guard',2)}${B.en.name}は${eBlk.v}ブロック`,'e');
  const hit=(att,def,blk,who)=>{
    const n=att.hits||1;
    for(let i=0;i<n;i++){
      if(!att.dmg)break;
      let d=att.dmg;const ab=att.pierce?0:Math.min(blk.v,d);blk.v-=ab;d-=ab;
      def.hp-=d;
      addLog(who==='p'?`→ ${B.en.name}に${d}ダメージ${ab?`(${ab}ブロック)`:att.pierce?'(貫通)':''}`:`→ あなたは${d}ダメージ${ab?`(${ab}ブロック)`:''}`,who==='p'?'p':'e');
    }
  };
  hit(P,B.e,eBlk,'p'); hit(E,B.p,pBlk,'e');
  if(P.refl){const r=Math.floor(P.refl*rawE);if(r>0){B.e.hp-=r;addLog(`${ic('guard',2)}反射!${B.en.name}に${r}ダメージ`,'p')}}
  if(E.refl){const r=Math.floor(E.refl*rawP);if(r>0){B.p.hp-=r;addLog(`${ic('guard',2)}${B.en.name}の反射!あなたは${r}ダメージ`,'e')}}
  if(P.heal){const h=Math.min(P.heal,B.p.max-B.p.hp);B.p.hp+=h;addLog(`${ic('heal',2)}あなたはHP${h}回復`,'p')}
  if(E.heal){const h=Math.min(E.heal,B.e.max-B.e.hp);B.e.hp+=h;addLog(`${ic('heal',2)}${B.en.name}はHP${h}回復`,'e')}
  if(P.poison){B.e.poison+=P.poison;addLog(`${ic('poison',2)}${B.en.name}に毒${P.poison}付与`,'p')}
  if(E.poison){B.p.poison+=E.poison;addLog(`${ic('poison',2)}あなたに毒${E.poison}付与`,'e')}
  [['p',B.p,'あなた'],['e',B.e,B.en.name]].forEach(([w,f,n])=>{
    if(f.poison>0){f.hp-=f.poison;addLog(`${ic('poison',2)}${n}は毒で${f.poison}ダメージ`,w==='p'?'e':'p');f.poison--}
  });
}

function stats(f){
  const o=eff(f,G.frame,cnt(G.die,G.frame)),a={};
  if(o.dmg)a['ダメージ']=o.dmg+(o.hits>1?'×'+o.hits:'');

  if(o.block)a['ブロック']=o.block;
  if(o.refl)a['反射']=Math.round(o.refl*100)+'%';
  if(o.heal)a['回復']=o.heal;

const stText=a=>Object.entries(a).map(([k,v])=>`${k} <b>${v}</b>`).join('　')||'効果なし';
function diffText(f,e){
  const b=stats(f),a=stats({...f,e:e?[e]:[]}),d=[];
  for(const k of new Set([...Object.keys(b),...Object.keys(a)]))if(String(a[k])!==String(b[k]))d.push(`${k} ${b[k]??'なし'} → <b>${a[k]??'なし'}</b>`);
